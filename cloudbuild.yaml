# cloudbuild.yaml — build, push, and deploy Child Malnutrition Prediction API to Cloud Run
#
# One-time setup (run once per GCP project, before the first build):
#   gcloud artifacts repositories create backend-images \
#     --repository-format=docker \
#     --location=asia-south1 \
#     --description="Backend service images"
#
# Manual build + deploy (from repo root):
#   gcloud builds submit --config cloudbuild.yaml .
#
# To use a different region/service/repo name without editing this file:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE_NAME=my-api,_REPOSITORY=my-repo .
#
# For auto-deploy on push, connect this repo under Cloud Build > Triggers
# and point the trigger at this file — no changes needed here.

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: childmal-backend
  _REPOSITORY: backend-images

steps:
  # 1. Build the image, tagged with both the commit SHA (traceable) and "latest"
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'
    waitFor: ['build']

  # 3. Deploy the newly pushed image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # ML models (RF + XGBoost) loaded into memory at startup — 512Mi default is tight, give it room
      - '--memory=1Gi'
      - '--cpu=1'
      # Keep at least 1 warm instance so model-loading cold starts (can be several seconds) don't hit users
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=60'
    waitFor: ['push']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
